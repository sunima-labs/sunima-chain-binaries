name: Build Linux Binary

on:
  push:
    tags:
      - 'v*-linux'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    
    steps:
      - name: Debug - Show OS
        run: |
          echo "=== Runner Info ==="
          uname -a
          echo "GOOS=$GOOS"
          echo "GOARCH=$GOARCH"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Arch: $RUNNER_ARCH"
      
      - name: Checkout source (sunima-chain)
        uses: actions/checkout@v4
        with:
          repository: sunima-labs/sunima-chain
          token: ${{ secrets.PAT_TOKEN }}
          submodules: recursive
          path: sunima-source
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev make git file
      
      - name: Fix go.mod for CI (remove local replace)
        working-directory: sunima-source
        run: |
          sed -i '/github.com\/cosmos\/evm => \/Users\/acteq\/cosmos-evm-fork/d' go.mod
          sed -i '/github.com\/cosmos\/cosmos-sdk =>/a \    github.com/cosmos/evm => github.com/cosmos/evm v0.2.0' go.mod
      
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      
      - name: Download dependencies
        working-directory: sunima-source
        run: go mod download
      
      - name: Build Linux binary
        working-directory: sunima-source
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags="-s -w" -o sunimad-linux-amd64 ./cmd/sunimad
      
      - name: Verify binary is ELF
        working-directory: sunima-source
        run: |
          echo "=== file output ==="
          file sunimad-linux-amd64
          echo "=== Checking for ELF ==="
          if file sunimad-linux-amd64 | grep -q "ELF 64-bit LSB executable, x86-64"; then
            echo "SUCCESS: Binary is Linux ELF x86-64"
          else
            echo "ERROR: Binary is NOT Linux ELF x86-64"
            file sunimad-linux-amd64
            exit 1
          fi
          sha256sum sunimad-linux-amd64 > sunimad-linux-amd64.sha256
          cat sunimad-linux-amd64.sha256
      
      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: |
            sunima-source/sunimad-linux-amd64
            sunima-source/sunimad-linux-amd64.sha256
          retention-days: 7
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            sunima-source/sunimad-linux-amd64
            sunima-source/sunimad-linux-amd64.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

