name: Build Linux Binary

on:
  push:
    tags:
      - 'v*-linux'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout source (sunima-chain)
        uses: actions/checkout@v4
        with:
          repository: sunima-labs/sunima-chain
          token: ${{ secrets.PAT_TOKEN }}
          submodules: recursive
          path: sunima-source
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev make git
      
      - name: Fix go.mod for CI (remove local replace)
        working-directory: sunima-source
        run: |
          # Remove local replace directive for cosmos/evm
          sed -i '/github.com\/cosmos\/evm => \/Users\/acteq\/cosmos-evm-fork/d' go.mod
          # Add proper replace
          sed -i '/github.com\/cosmos\/cosmos-sdk =>/a \    github.com/cosmos/evm => github.com/cosmos/evm v0.2.0' go.mod
      
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      
      - name: Download dependencies
        working-directory: sunima-source
        run: go mod download
      
      - name: Build Linux binary
        working-directory: sunima-source
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -o sunimad-linux-amd64 ./cmd/sunimad
      
      - name: Verify binary
        working-directory: sunima-source
        run: |
          file sunimad-linux-amd64
          sha256sum sunimad-linux-amd64 > sunimad-linux-amd64.sha256
          cat sunimad-linux-amd64.sha256
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            sunima-source/sunimad-linux-amd64
            sunima-source/sunimad-linux-amd64.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

