name: Build Linux Binary

on:
  push:
    tags:
      - 'v*-linux'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev make git
      
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      
      - name: Download dependencies
        run: go mod download
      
      - name: Build Linux binary
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
        run: |
          # The libkzg_ffi.so needs to be available
          # For now we'll build without it and see if it works
          go build -o sunimad-linux-amd64 ./cmd/sunimad
      
      - name: Verify binary
        run: |
          file sunimad-linux-amd64
          sha256sum sunimad-linux-amd64 > sunimad-linux-amd64.sha256
          cat sunimad-linux-amd64.sha256
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            sunimad-linux-amd64
            sunimad-linux-amd64.sha256
          draft: false
          prerelease: false

